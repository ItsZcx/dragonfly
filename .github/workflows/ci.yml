name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    name: build (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The four presets from CMakePresets.json. dev and release are
        # uninstrumented. debug carries AddressSanitizer and
        # UndefinedBehaviorSanitizer, tsan carries ThreadSanitizer. ASan and
        # TSan cannot share one build: each needs its own shadow-memory layout,
        # and the compiler rejects the combination.
        preset: [dev, release, debug, tsan]

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config

      - name: Enable GitHub Actions vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # bootstrap.sh always installs vcpkg at <repo>/.vcpkg. The key includes
      # vcpkg.json so the cache is dropped when a dependency or the pinned
      # baseline changes.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: ./scripts/bootstrap.sh

      - name: Build
        run: ./scripts/build.sh ${{ matrix.preset }}
        env:
          CXX: clang++

      - name: Test
        run: ./scripts/test.sh ${{ matrix.preset }}

  lint:
    name: format & lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy ninja-build pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: ./scripts/bootstrap.sh

      - name: Check formatting
        run: ./scripts/format.sh --check

      # clang-tidy reads compile_commands.json, which build.sh writes as a
      # symlink at the repository root. A build must run before linting.
      - name: Configure
        run: ./scripts/build.sh dev
        env:
          CXX: clang++

      - name: Lint
        run: ./scripts/lint.sh
